[workspace]
members = [
    "crates/statesolver-analysis",
    "crates/statesolver-cli",
    "crates/statesolver-harness",
    "crates/statesolver-record",
    "crates/statesolver-replay",
    "crates/statesolver-trace",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/elixpo/statesolver"
homepage = "https://statesolver.elixpo.com"

# `statesolver-record` and `statesolver-replay` are the only crates that may
# relax this (to `deny`, with `// SAFETY:` on every block): ptrace, fork, and
# raw process memory need it.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
proptest = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zstd = "0.14"
nix = { version = "0.31", features = ["ptrace", "process", "signal", "uio", "personality"] }
object = { version = "0.40", default-features = false, features = ["read", "std"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
statesolver-trace = { path = "crates/statesolver-trace" }
statesolver-analysis = { path = "crates/statesolver-analysis" }
statesolver-record = { path = "crates/statesolver-record" }
statesolver-replay = { path = "crates/statesolver-replay" }

[profile.release]
lto = "thin"
codegen-units = 1
